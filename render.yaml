# Déploiement de l'API PHARMACORP ERP sur Render (Blueprint : New > Blueprint depuis le dépôt).
# La base de données (DATABASE_URL) et les secrets JWT sont saisis à la main dans le tableau de bord
# Render (onglet Environment du service), jamais commités ici.
services:
  - type: web
    name: pharmacorp-erp-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    # --include=dev est indispensable : NODE_ENV=production (ci-dessous) s'applique aussi au build sur Render,
    # ce qui pousse npm a ignorer les devDependencies (typescript, prisma CLI, nest-cli...) sans ce drapeau --
    # tsc tombait alors sur une copie globale non maitrisee de l'image de Render (source du TS5108 persistant).
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build -w @erp/database && npm run build -w @erp/api
    # node sur le JS deja compile (pas "npm run db:seed", qui passe par ts-node : trop gourmand en memoire
    # pour le plan gratuit de Render, qui a fait planter le premier demarrage avec un heap out of memory).
    startCommand: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma && node packages/database/dist/seed.js && node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QUEUE_MODE
        value: "off"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Assistant IA (Pilotage) : facultatif, desactive par defaut (Panneau d'administration -> Fonctions).
      # Sans cette cle, l'assistant refuse proprement (503) si quelqu'un l'active quand meme -- rien ne casse.
      # A renseigner le jour du deploiement massif : console.anthropic.com -> API Keys -> coller ici (jamais ici en clair).
      - key: ANTHROPIC_API_KEY
        sync: false
